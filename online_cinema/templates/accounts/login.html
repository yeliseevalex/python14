<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Вхід - Online Cinema</title>
</head>
<body>
    <h1>Online Cinema</h1>
    <h2>Вхід</h2>

    {% if error %}
        <p>
            {{ error }}
        </p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <p>
            <label>Username</label>
            <input type="text" name="username" required>
        </p>

        <p>
            <label>Password</label>
            <input type="password" name="password" required>
        </p>

        <button type="submit">Увійти</button>
    </form>

    <p>
        Немає акаунта
        <a href="{% url 'register' %}">Зареєструватися</a>
    </p>
</body>
</html>
